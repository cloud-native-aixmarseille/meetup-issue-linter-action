name: Reconcile meetup communications
description: Reconcile due meetup communications and dispatch them through the configured mail and Slack gateways when approval and delivery checks pass. Publish redacted diagnostics in annotations, logs, and the job summary.
author: Cloud Native Aix-Marseille
inputs:
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: false
    default: en
  issue-number:
    description: GitHub issue number in the caller repository containing the meetup event document to inspect.
    required: true
  github-token:
    description: Token for the caller repository. Requires issues:write for approval, delivery ledger, and diagnostic comments.
    required: true
  managed-comment-author:
    description: Trusted bot login allowed to create or update managed delivery ledger and communication diagnostic comments, for example my-app[bot].
    required: true
  mailings-token:
    description: Token used to dispatch approved email communications to the configured mailings repository.
    required: true
  slack-channel-id:
    description: Slack channel ID used for approved notifications.
    required: true
  slack-token:
    description: Slack bot token used for approved notifications.
    required: true
  report-errors-to-issue:
    description: Use true to record communication diagnostics in a managed meetup issue comment and succeed after persistence, or false to fail on error diagnostics. Execution and comment persistence failures still fail the action. Requires the shared event lock.
    required: true
outputs:
  result:
    description: Versioned redacted JSON envelope containing the effective mode, reconciliation counts, hashed intent identifiers, and diagnostics.
  planned-count:
    description: Number of due communication intents identified for the current event revision.
  dispatched-count:
    description: Number of gateway calls attempted during this run.
  diagnostics:
    description: Redacted JSON diagnostics safe to expose in workflow logs and summaries.
runs:
  using: node24
  main: dist/index.js
